spring:
  cloud:
    nacos:
      discovery:
        enabled: false
    consul:
      host: 192.168.0.100
      #      host: 162.14.66.67
      port: 8500
      discovery:
        health-check-critical-timeout: 30s
        service-name: ${spring.application.name}
        heartbeat:
          enabled: true
        instance-id: ${spring.application.name}-${server.port}
        enabled: true
        prefer-ip-address: true
